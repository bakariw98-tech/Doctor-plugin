<!-- mcp-app.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately not the creator's name: this title is baked into the
         built bundle, where src/creator.ts can't reach it, and no host
         shows the title of a widget iframe anyway. -->
    <title>Recommendations</title>
    <style>
      :root {
        color-scheme: light dark;
        --page:  #fefdfc;
        --text:  #262422;
        --chip:  rgba(28, 26, 23, 0.88);
        --rest:  0 1px 2px rgba(20, 18, 15, 0.07), 0 4px 12px rgba(20, 18, 15, 0.07);
        --lift:  0 2px 4px rgba(20, 18, 15, 0.10), 0 12px 28px rgba(20, 18, 15, 0.13);
        /* --accent is set from src/creator.ts at render time when a creator
           configured one; these two are the fallback pair, each picked for
           its own ground. */
        --ring:  var(--accent, #b5541f);
        --btn-bg: #ffffff;
        --btn-border: #d8d3cc;
        --card:  #ffffff;
        --shade: #f4f1ed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page:  #252321;
          --text:  #eeece9;
          --chip:  rgba(18, 17, 15, 0.90);
          --rest:  0 1px 2px rgba(0, 0, 0, 0.30), 0 4px 12px rgba(0, 0, 0, 0.32);
          --lift:  0 2px 4px rgba(0, 0, 0, 0.38), 0 12px 28px rgba(0, 0, 0, 0.44);
          --ring:  var(--accent, #d98a4f);
          --btn-bg: #2b2926;
          --btn-border: #45413c;
          --card:  #2b2926;
          --shade: #1f1d1b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: transparent;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { padding: 4px; }

      /* Fullscreen is the one control the widget owns — every other
         interactive element is a product's own Get it. It only appears
         when the host supports it and there's enough to browse
         (src/mcp-app.ts). */
      #fullscreen-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
      #fullscreen-bar[hidden] { display: none; }
      #fullscreen-toggle {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text);
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }

      /* Two components, four containers. `card`/`spotlight` draw the full
         pick (photo, name, Get it); `list` draws scannable rows, `grid`
         draw a compact tile that is itself the button. See
         src/product-card.ts. */
      .view-solo .pcard { width: 100%; max-width: 460px; }
      .view-split { display: flex; gap: 12px; flex-wrap: wrap; }
      .view-split .pcard { flex: 1 1 240px; min-width: 0; }
      .view-list { display: flex; flex-direction: column; gap: 8px; }
      .view-wall {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 10px;
      }
      .view-wall .pcard { width: 100%; }

      .pcard {
        display: block; text-align: left; margin: 0;
        border-radius: 12px; overflow: hidden;
        background: var(--card); border: 1px solid var(--btn-border);
        box-shadow: var(--rest);
        transition: box-shadow 160ms ease, transform 160ms ease;
      }
      /* Product photography is usually a centred object on white, so it's
         contained on a neutral ground rather than cropped to fill the way
         a 16:9 video still was — `cover` here cuts the product in half. */
      .pcard-img {
        display: flex; align-items: center; justify-content: center;
        aspect-ratio: 16 / 9; background: #ffffff; overflow: hidden;
      }
      .pcard-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .pcard-noimg { color: var(--text); opacity: 0.28; }
      .pcard-body { display: block; padding: 12px; }
      .pcard-name {
        display: block; margin: 0;
        font-size: 14px; font-weight: 650; line-height: 1.3; color: var(--text);
      }
      .pcard-price {
        display: inline-block; font-size: 12.5px; color: var(--text);
        opacity: 0.6; font-variant-numeric: tabular-nums;
      }

      /* Compact: the whole tile is the button (grid/fullscreen). */
      .pcard-compact {
        border: 1px solid var(--btn-border); padding: 0; cursor: pointer;
        font-family: inherit; width: 100%;
      }
      .pcard-compact .pcard-body { padding: 9px 10px 11px; }
      .pcard-compact .pcard-name {
        font-size: 12.5px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pcard-compact .pcard-price { margin-top: 3px; font-size: 11.5px; }
      .pcard-compact .pcard-promo { margin-top: 3px; }
      .pcard-compact:hover { transform: translateY(-2px); box-shadow: var(--lift); }
      .pcard-compact:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring);
      }

      /* List: a scannable row, the whole thing clickable. Each row carries
         its own one-liner because at four-plus results the agent can't
         narrate every reason without becoming a wall of text. */
      .pcard-row {
        display: flex; align-items: stretch; gap: 0; text-align: left;
        border: 1px solid var(--btn-border); padding: 0; cursor: pointer;
        font-family: inherit; width: 100%;
      }
      .pcard-row .pcard-img {
        flex: 0 0 84px; width: 84px; aspect-ratio: 1 / 1; border-radius: 0;
      }
      .pcard-row .pcard-body {
        flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
        justify-content: center; gap: 3px; padding: 10px 12px;
      }
      .pcard-row .pcard-name { font-size: 13.5px; }
      .pcard-line {
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; font-size: 12.5px; line-height: 1.45;
        color: var(--text); opacity: 0.68;
      }
      .pcard-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .pcard-meta:empty { display: none; }
      .pcard-go {
        flex: 0 0 auto; display: flex; align-items: center; padding-right: 12px;
        color: var(--ring);
      }
      .pcard-go svg { width: 17px; height: 17px; display: block; }
      .pcard-row:hover { transform: translateY(-1px); box-shadow: var(--lift); }
      .pcard-row:active { transform: none; }
      .pcard-row:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring);
      }

      /* Detail: an article containing exactly one button. Deliberately NOT
         clickable as a whole — a button inside a button is invalid and
         breaks keyboard traversal. No blurb/brand/audience here — those
         are prose, and prose is the agent's job (src/product-card.ts). */
      .pcard-detail .pcard-body { padding: 14px 16px 16px; }
      .pcard-detail .pcard-name { font-size: 17px; letter-spacing: -0.01em; }
      .pcard-actions {
        display: flex; align-items: center; gap: 10px; margin-top: 14px;
        flex-wrap: wrap;
      }
      .pcard-buy {
        font: inherit; font-size: 14px; font-weight: 650; color: #fff;
        background: var(--ring); border: 0; border-radius: 8px;
        padding: 9px 18px; cursor: pointer;
      }
      .pcard-buy:hover { filter: brightness(1.08); }
      .pcard-buy:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring);
      }
      .pcard-promo {
        display: inline-block; font-size: 11.5px; font-weight: 700;
        letter-spacing: 0.02em; color: var(--ring);
        border: 1px dashed var(--ring); border-radius: 5px;
        padding: 2px 7px; font-variant-numeric: tabular-nums;
      }

      /* "How I use it" — detail someone only wants once they're already
         interested, so it costs nothing until they ask for it. */
      .pcard-usage { margin-top: 12px; border-top: 1px solid var(--btn-border); padding-top: 10px; }
      .pcard-usage summary {
        cursor: pointer; font-size: 12.5px; font-weight: 650; color: var(--ring);
        list-style: none;
      }
      .pcard-usage summary::-webkit-details-marker { display: none; }
      .pcard-usage summary::after { content: " ›"; display: inline-block; transition: transform 140ms ease; }
      .pcard-usage[open] summary::after { transform: rotate(90deg); }
      .pcard-usage summary:focus-visible {
        outline: none; border-radius: 4px;
        box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring);
      }
      .pcard-usage p {
        margin: 8px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--text);
      }

      .empty { font-size: 13px; color: var(--text); opacity: 0.6; }

      /* Affiliate disclosure, drawn once under the set (src/product-card.ts).
         Quiet is the goal, hidden is not: every Get it above it is a paid
         link, so this has to stay legible at any density. */
      .pcard-disclosure {
        margin: 10px 2px 0; font-size: 11.5px; line-height: 1.45;
        color: var(--text); opacity: 0.6;
      }

      /* Screen-reader-only summary — there's no visible status line (the
         agent's own message covers that), but the count should still be
         announced when results load. */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="fullscreen-bar" hidden>
        <button id="fullscreen-toggle" type="button"></button>
      </div>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
      <div id="root"></div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
