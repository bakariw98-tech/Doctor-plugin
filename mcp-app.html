<!-- mcp-app.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Creator Picks</title>
    <style>
      :root {
        color-scheme: light dark;
        --page:  #fefdfc;
        --text:  #262422;
        --chip:  rgba(28, 26, 23, 0.88);
        --rest:  0 1px 2px rgba(20, 18, 15, 0.07), 0 4px 12px rgba(20, 18, 15, 0.07);
        --lift:  0 2px 4px rgba(20, 18, 15, 0.10), 0 12px 28px rgba(20, 18, 15, 0.13);
        --ring:  #b5541f;
        --btn-bg: #ffffff;
        --btn-border: #d8d3cc;
        --card:  #ffffff;
        --shade: #f4f1ed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page:  #252321;
          --text:  #eeece9;
          --chip:  rgba(18, 17, 15, 0.90);
          --rest:  0 1px 2px rgba(0, 0, 0, 0.30), 0 4px 12px rgba(0, 0, 0, 0.32);
          --lift:  0 2px 4px rgba(0, 0, 0, 0.38), 0 12px 28px rgba(0, 0, 0, 0.44);
          --ring:  #d98a4f;
          --btn-bg: #2b2926;
          --btn-border: #45413c;
          --card:  #2b2926;
          --shade: #1f1d1b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: transparent;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { padding: 4px; }

      /* Fullscreen is the one control the widget owns — every other
         interactive element is a product's own Get it. It only appears
         when the host supports it and there's enough to browse
         (src/mcp-app.ts). */
      #fullscreen-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
      #fullscreen-bar[hidden] { display: none; }
      #fullscreen-toggle {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text);
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }

      /* Two components, four containers. `card`/`spotlight` draw the full
         pick (photo, name, the creator's line, Get it); `carousel`/`grid`
         draw a compact tile that is itself the button. See
         src/product-card.ts. */
      .view-solo .pcard { width: 100%; max-width: 460px; }
      .view-split { display: flex; gap: 12px; flex-wrap: wrap; }
      .view-split .pcard { flex: 1 1 240px; min-width: 0; }
      .view-strip {
        display: flex; gap: 10px; overflow-x: auto;
        scroll-snap-type: x mandatory; padding-bottom: 4px;
        scrollbar-width: none;
      }
      .view-strip::-webkit-scrollbar { display: none; }
      .view-strip .pcard { flex: 0 0 148px; width: 148px; scroll-snap-align: start; }
      .view-wall {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 10px;
      }
      .view-wall .pcard { width: 100%; }

      /* Carousel scroll affordance (src/product-card.ts) — the strip's own
         scrollbar is hidden above, so nothing else on screen shows
         there's more to scroll to without this. */
      .shots-wrapper { position: relative; }
      .scroll-hint {
        position: absolute; right: 4px; bottom: 10px;
        opacity: 0; transition: opacity 200ms ease; pointer-events: none;
      }
      .scroll-hint.visible { opacity: 1; }
      .scroll-hint-chip {
        display: inline-block; background: var(--chip); color: #fff;
        font-size: 11px; font-weight: 700; white-space: nowrap;
        padding: 4px 9px; border-radius: 999px; box-shadow: var(--rest);
      }

      .pcard {
        display: block; text-align: left; margin: 0;
        border-radius: 12px; overflow: hidden;
        background: var(--card); border: 1px solid var(--btn-border);
        box-shadow: var(--rest);
        transition: box-shadow 160ms ease, transform 160ms ease;
      }
      /* Product photography is usually a centred object on white, so it's
         contained on a neutral ground rather than cropped to fill the way
         a 16:9 video still was — `cover` here cuts the product in half. */
      .pcard-img {
        display: flex; align-items: center; justify-content: center;
        aspect-ratio: 1 / 1; background: var(--shade); overflow: hidden;
      }
      .pcard-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .pcard-noimg { color: var(--text); opacity: 0.28; }
      .pcard-body { display: block; padding: 12px; }
      .pcard-name {
        display: block; margin: 0;
        font-size: 14px; font-weight: 650; line-height: 1.3; color: var(--text);
      }
      .pcard-price {
        display: inline-block; font-size: 12.5px; color: var(--text);
        opacity: 0.6; font-variant-numeric: tabular-nums;
      }

      /* Compact: the whole tile is the button (carousel/grid). */
      .pcard-compact {
        border: 1px solid var(--btn-border); padding: 0; cursor: pointer;
        font-family: inherit; width: 100%;
      }
      .pcard-compact .pcard-body { padding: 9px 10px 11px; }
      .pcard-compact .pcard-name {
        font-size: 12.5px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pcard-compact .pcard-price { margin-top: 3px; font-size: 11.5px; }
      .pcard-compact .pcard-promo { margin-top: 3px; }
      .pcard-compact:hover { transform: translateY(-2px); box-shadow: var(--lift); }
      .pcard-compact:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring);
      }

      /* Detail: an article containing exactly one button. Deliberately NOT
         clickable as a whole — a button inside a button is invalid and
         breaks keyboard traversal. No blurb/brand/audience here — those
         are prose, and prose is the agent's job (src/product-card.ts). */
      .pcard-detail .pcard-img { aspect-ratio: 4 / 3; }
      .pcard-detail .pcard-body { padding: 14px 16px 16px; }
      .pcard-detail .pcard-name { font-size: 17px; letter-spacing: -0.01em; }
      .pcard-actions {
        display: flex; align-items: center; gap: 10px; margin-top: 14px;
        flex-wrap: wrap;
      }
      .pcard-buy {
        font: inherit; font-size: 14px; font-weight: 650; color: #fff;
        background: var(--ring); border: 0; border-radius: 8px;
        padding: 9px 18px; cursor: pointer;
      }
      .pcard-buy:hover { filter: brightness(1.08); }
      .pcard-buy:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring);
      }
      .pcard-promo {
        display: inline-block; font-size: 11.5px; font-weight: 700;
        letter-spacing: 0.02em; color: var(--ring);
        border: 1px dashed var(--ring); border-radius: 5px;
        padding: 2px 7px; font-variant-numeric: tabular-nums;
      }

      .empty { font-size: 13px; color: var(--text); opacity: 0.6; }

      /* Screen-reader-only summary — there's no visible status line (the
         agent's own message covers that), but the count should still be
         announced when results load. */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="fullscreen-bar" hidden>
        <button id="fullscreen-toggle" type="button"></button>
      </div>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
      <div id="root"></div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
