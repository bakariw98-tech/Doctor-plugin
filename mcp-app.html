<!-- mcp-app.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Doctor Video Search</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: transparent;
        color: #1a1a1a;
      }
      #app { padding: 12px; }
      #search-form { display: flex; gap: 8px; margin-bottom: 10px; }
      #search-input {
        flex: 1;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d0d0d0;
        font-size: 14px;
        min-width: 0;
      }
      #search-form button {
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        background: #1a73e8;
        color: white;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      #search-form button:disabled { opacity: 0.6; cursor: default; }
      #status { font-size: 12px; color: #666; margin-bottom: 8px; min-height: 16px; }
      #fullscreen-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
      #fullscreen-bar[hidden] { display: none; }
      #fullscreen-toggle {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #d0d0d0;
        background: white;
        font-size: 12px;
        cursor: pointer;
      }

      /* Carousel view */
      .carousel-track {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
        scroll-snap-type: x mandatory;
      }
      .card {
        flex: 0 0 220px;
        scroll-snap-align: start;
        border-radius: 12px;
        overflow: hidden;
        background: #f7f7f8;
        border: 1px solid #e5e5e5;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        margin: 8px 10px 2px;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta { font-size: 11px; color: #888; margin: 0 10px 10px; }

      /* Grid view (fullscreen) */
      .grid-track {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .grid-track .card { flex: initial; }

      /* Card (single-result detail) view */
      .card-detail {
        border-radius: 12px;
        overflow: hidden;
        background: #f7f7f8;
        border: 1px solid #e5e5e5;
      }
      .card-detail-thumb {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        padding: 0;
        border: none;
        cursor: pointer;
        background: #000;
      }
      .card-detail-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card-detail-body { padding: 12px; }
      .card-detail-title { font-size: 16px; font-weight: 600; margin: 0 0 6px; line-height: 1.3; }
      .card-detail-meta { font-size: 12px; color: #888; margin: 0 0 8px; }
      .card-detail-desc { font-size: 13px; color: #555; margin: 0 0 12px; line-height: 1.4; }

      /* Spotlight view */
      .spotlight-list { display: flex; flex-direction: column; gap: 14px; }
      .spotlight-card {
        display: flex;
        gap: 12px;
        border-radius: 12px;
        overflow: hidden;
        background: #f7f7f8;
        border: 1px solid #e5e5e5;
        padding: 10px;
      }
      .spotlight-thumb {
        position: relative;
        flex: 0 0 140px;
        aspect-ratio: 16 / 9;
        padding: 0;
        border: none;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        background: #000;
        align-self: flex-start;
      }
      .spotlight-body { flex: 1; min-width: 0; }
      .spotlight-title {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
        line-height: 1.3;
      }
      .spotlight-meta { font-size: 11px; color: #888; margin: 0 0 6px; }
      .spotlight-desc {
        font-size: 12px;
        color: #555;
        margin: 0 0 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .watch-btn {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #1a73e8;
        color: #1a73e8;
        background: white;
        font-size: 12px;
        cursor: pointer;
      }

      /* Shared thumbnail chrome */
      .thumb-btn,
      .spotlight-thumb {
        position: relative;
        display: block;
        width: 100%;
        border: none;
        cursor: pointer;
        background: #000;
      }
      .thumb-btn { aspect-ratio: 16 / 9; padding: 0; }
      .thumb-btn img,
      .spotlight-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .duration {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        font-size: 11px;
        padding: 2px 5px;
        border-radius: 4px;
      }
      .play-icon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        opacity: 0.9;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }

      .empty { font-size: 13px; color: #888; }
      @media (prefers-color-scheme: dark) {
        body { color: #f0f0f0; }
        #search-input { background: #2a2a2a; border-color: #444; color: #f0f0f0; }
        #fullscreen-toggle { background: #2a2a2a; border-color: #444; color: #f0f0f0; }
        .card, .spotlight-card, .card-detail { background: #1e1e1e; border-color: #333; }
        .meta, .spotlight-meta, .card-detail-meta { color: #999; }
        .spotlight-desc, .card-detail-desc { color: #ccc; }
        .watch-btn { background: #2a2a2a; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <form id="search-form">
        <input
          id="search-input"
          type="text"
          placeholder="Search this channel (e.g. &quot;lower back pain&quot;)"
        />
        <button id="search-button" type="submit">Search</button>
      </form>
      <div id="status"></div>
      <div id="fullscreen-bar" hidden>
        <button id="fullscreen-toggle" type="button"></button>
      </div>
      <div id="root"></div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
