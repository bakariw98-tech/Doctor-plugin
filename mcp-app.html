<!-- mcp-app.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Doctor Video Search</title>
    <style>
      :root {
        color-scheme: light dark;
        --page:  #fefdfc;
        --text:  #262422;
        --chip:  rgba(28, 26, 23, 0.88);
        --rest:  0 1px 2px rgba(20, 18, 15, 0.07), 0 4px 12px rgba(20, 18, 15, 0.07);
        --lift:  0 2px 4px rgba(20, 18, 15, 0.10), 0 12px 28px rgba(20, 18, 15, 0.13);
        --ring:  #b5541f;
        --btn-bg: #ffffff;
        --btn-border: #d8d3cc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page:  #252321;
          --text:  #eeece9;
          --chip:  rgba(18, 17, 15, 0.90);
          --rest:  0 1px 2px rgba(0, 0, 0, 0.30), 0 4px 12px rgba(0, 0, 0, 0.32);
          --lift:  0 2px 4px rgba(0, 0, 0, 0.38), 0 12px 28px rgba(0, 0, 0, 0.44);
          --ring:  #d98a4f;
          --btn-bg: #2b2926;
          --btn-border: #45413c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: transparent;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { padding: 4px; }

      /* Fullscreen is the one legitimate control here — everything else
         is thumbnails. It only appears when the host supports it and
         there's enough to browse (src/mcp-app.ts). */
      #fullscreen-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
      #fullscreen-bar[hidden] { display: none; }
      #fullscreen-toggle {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text);
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }

      /* The one component, four containers. */
      .view-solo .shot { width: 100%; }
      .view-split { display: flex; gap: 10px; }
      .view-split .shot { flex: 1 1 0; min-width: 0; }
      .view-strip {
        display: flex; gap: 10px; overflow-x: auto;
        scroll-snap-type: x mandatory; padding-bottom: 4px;
        scrollbar-width: none;
      }
      .view-strip::-webkit-scrollbar { display: none; }
      .view-strip .shot { flex: 0 0 172px; width: 172px; scroll-snap-align: start; }
      .view-wall {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .view-wall .shot { width: 100%; }

      .shot {
        position: relative; display: block; width: 100%;
        aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
        border: 0; padding: 0; margin: 0; cursor: pointer;
        background: #000; box-shadow: var(--rest);
        transition: box-shadow 160ms ease, transform 160ms ease;
      }
      .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .shot:hover { transform: translateY(-2px); box-shadow: var(--lift); }
      .shot:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring);
      }
      .dur {
        position: absolute; right: 6px; bottom: 6px;
        background: var(--chip); color: #fff;
        font-size: 11px; font-weight: 600; line-height: 1;
        font-variant-numeric: tabular-nums; letter-spacing: 0.012em;
        padding: 4px 6px; border-radius: 5px;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      }
      /* carousel/grid thumbnails carry a title (see src/carousel.ts) —
         move the duration chip out of the caption's way when one's present. */
      .shot:has(.title) .dur { bottom: auto; top: 6px; }
      .cue {
        position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(20, 18, 15, 0.28);
        opacity: 0; transition: opacity 160ms ease;
      }
      .shot:hover .cue, .shot:focus-visible .cue { opacity: 1; }
      .cue svg { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5)); }
      .title {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 20px 8px 6px;
        background: linear-gradient(to top, rgba(10, 9, 8, 0.88), rgba(10, 9, 8, 0));
        color: #fff; font-size: 11.5px; font-weight: 600; line-height: 1.25;
        text-align: left;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; text-overflow: ellipsis;
        pointer-events: none;
      }

      .empty { font-size: 13px; color: var(--text); opacity: 0.6; }

      /* Screen-reader-only summary — there's no visible status line (the
         agent's own message covers that), but the count should still be
         announced when results load. */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="fullscreen-bar" hidden>
        <button id="fullscreen-toggle" type="button"></button>
      </div>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
      <div id="root"></div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
