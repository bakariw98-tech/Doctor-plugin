<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --page:  oklch(0.995 0.002 60);
      --text:  oklch(0.26 0.008 60);
      --card:  oklch(1 0 0);
      --shade: oklch(0.965 0.004 60);
      --line:  oklch(0.89 0.006 60);
      --chip:  oklch(0.17 0.01 60 / 0.88);
      --rest:  0 1px 2px oklch(0.2 0.01 60 / 0.07), 0 4px 12px oklch(0.2 0.01 60 / 0.07);
      --lift:  0 2px 4px oklch(0.2 0.01 60 / 0.10), 0 12px 28px oklch(0.2 0.01 60 / 0.13);
      --ring:  oklch(0.55 0.14 45);
    }
    .dark{
      --page:  oklch(0.185 0.006 60);
      --text:  oklch(0.93 0.004 60);
      --card:  oklch(0.225 0.006 60);
      --shade: oklch(0.165 0.006 60);
      --line:  oklch(0.32 0.008 60);
      --chip:  oklch(0.12 0.01 60 / 0.90);
      --rest:  0 1px 2px oklch(0 0 0 / 0.30), 0 4px 12px oklch(0 0 0 / 0.32);
      --lift:  0 2px 4px oklch(0 0 0 / 0.38), 0 12px 28px oklch(0 0 0 / 0.44);
      --ring:  oklch(0.74 0.13 55);
    }
    *{ box-sizing: border-box; }
    body{
      margin: 0; background: var(--page); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* THE COMPONENT, AT TWO DENSITIES. Unlike the video widget this
       replaced, text lives inside the card: someone about to spend money
       needs the name and the buy affordance at the point of the tap.
       See README.md — this reversal is deliberate. */
    .pcard{
      display: block; text-align: left; margin: 0;
      border-radius: 12px; overflow: hidden;
      background: var(--card); border: 1px solid var(--line);
      box-shadow: var(--rest);
      transition: box-shadow 160ms ease, transform 160ms ease;
    }
    /* contain, not cover: product shots are centred objects on white and
       cropping to fill cuts the product in half. */
    .pimg{
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 1 / 1; background: var(--shade); overflow: hidden;
    }
    .pimg img{ width: 100%; height: 100%; object-fit: contain; display: block; }
    .pbody{ padding: 12px; }
    .pname{ margin: 0; font-size: 14px; font-weight: 650; line-height: 1.3; }
    .pprice{ font-size: 12.5px; opacity: 0.6; font-variant-numeric: tabular-nums; }

    /* Compact (4+ and fullscreen): the whole tile is the button. */
    .compact{ cursor: pointer; }
    .compact .pbody{ padding: 9px 10px 11px; }
    .compact .pname{ font-size: 12.5px; }
    .compact .pprice{ display: block; margin-top: 3px; font-size: 11.5px; }
    .compact:hover{ transform: translateY(-2px); box-shadow: var(--lift); }

    /* Detail (1 and 2-3): an <article> containing exactly ONE button.
       Never also clickable as a whole — a button inside a button is
       invalid and breaks keyboard traversal. */
    .detail .pimg{ aspect-ratio: 4 / 3; }
    .detail .pbody{ padding: 14px 16px 16px; }
    .pbrand{ margin: 0 0 3px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.5; }
    .detail .pname{ font-size: 17px; letter-spacing: -0.01em; }
    /* The creator's own words — full weight, full opacity. This is the
       substance of the recommendation, not a caption. */
    .pblurb{ margin: 9px 0 0; font-size: 14px; line-height: 1.5; }
    .pfor{ margin: 7px 0 0; font-size: 13px; line-height: 1.45; opacity: 0.62; }
    .pact{ display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .pbuy{
      font: inherit; font-size: 14px; font-weight: 650; color: #fff;
      background: var(--ring); border: 0; border-radius: 8px;
      padding: 9px 18px; cursor: pointer;
    }
    .compact{ flex: 0 0 148px; width: 148px; }
  </style>
</helmet>
<div style="display:flex;gap:10px;padding:20px;overflow-x:auto">
      <button class="pcard compact" aria-label="Get 8-inch chef's knife">
        <span class="pimg"><img src="./just-do-this.jpg" alt=""></span>
        <span class="pbody">
          <span class="pname">8-inch chef's knife</span>
          <span class="pprice">~$85</span>
        </span>
      </button>
      <button class="pcard compact" aria-label="Get End-grain board">
        <span class="pimg"><img src="./omad-fasting.jpg" alt=""></span>
        <span class="pbody">
          <span class="pname">End-grain board</span>
          <span class="pprice">~$120</span>
        </span>
      </button>
      <button class="pcard compact" aria-label="Get Cast iron skillet">
        <span class="pimg"><img src="./autophagy-this.jpg" alt=""></span>
        <span class="pbody">
          <span class="pname">Cast iron skillet</span>
          <span class="pprice">~$30</span>
        </span>
      </button>
      <button class="pcard compact" aria-label="Get Fish spatula">
        <span class="pimg"><img src="./fasting-state.jpg" alt=""></span>
        <span class="pbody">
          <span class="pname">Fish spatula</span>
          <span class="pprice">~$18</span>
        </span>
      </button>
      <button class="pcard compact" aria-label="Get Bench scraper">
        <span class="pimg"><img src="./rethink-fasting.jpg" alt=""></span>
        <span class="pbody">
          <span class="pname">Bench scraper</span>
          <span class="pprice">~$12</span>
        </span>
      </button>
      <button class="pcard compact" aria-label="Get Pepper mill">
        <span class="pimg"><img src="./no-fast-autophagy.jpg" alt=""></span>
        <span class="pbody">
          <span class="pname">Pepper mill</span>
          <span class="pprice">~$45</span>
        </span>
      </button>
</div>
</x-dc>
</body>
</html>
