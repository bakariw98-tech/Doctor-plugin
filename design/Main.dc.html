<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --page:  oklch(0.995 0.002 60);
      --text:  oklch(0.26 0.008 60);
      --chip:  oklch(0.17 0.01 60 / 0.88);
      --rest:  0 1px 2px oklch(0.2 0.01 60 / 0.07), 0 4px 12px oklch(0.2 0.01 60 / 0.07);
      --lift:  0 2px 4px oklch(0.2 0.01 60 / 0.10), 0 12px 28px oklch(0.2 0.01 60 / 0.13);
      --ring:  oklch(0.55 0.14 45);
    }
    .dark{
      --page:  oklch(0.185 0.006 60);
      --text:  oklch(0.93 0.004 60);
      --chip:  oklch(0.12 0.01 60 / 0.90);
      --rest:  0 1px 2px oklch(0 0 0 / 0.30), 0 4px 12px oklch(0 0 0 / 0.32);
      --lift:  0 2px 4px oklch(0 0 0 / 0.38), 0 12px 28px oklch(0 0 0 / 0.44);
      --ring:  oklch(0.74 0.13 55);
    }
    *{ box-sizing: border-box; }
    body{
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a{ color: var(--ring); text-decoration: none; }
    a:hover{ color: var(--ring); }


    /* THE ENTIRE WIDGET. A thumbnail is the whole component: no frame,
       no surface, no label. Title rides in aria-label for screen readers. */
    .shot{
      position: relative; display: block; flex: 0 0 auto;
      aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
      background: oklch(0.5 0.01 60);
      box-shadow: var(--rest); outline: none;
      transition: box-shadow 160ms ease, transform 160ms ease;
    }
    .shot img{ width: 100%; height: 100%; object-fit: cover; display: block; }
    .shot:hover{ transform: translateY(-2px); box-shadow: var(--lift); }
    .shot:focus-visible{ box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ring); }

    /* Kept: it sits ON the image, adds no layout, and the agent cannot
       recite eight durations in a sentence. Easy to remove if unwanted. */
    .dur{
      position: absolute; right: 6px; bottom: 6px;
      background: var(--chip); color: #fff;
      font-size: 11.5px; font-weight: 600; line-height: 1;
      font-variant-numeric: tabular-nums; letter-spacing: 0.012em;
      padding: 4px 6px; border-radius: 5px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .cue{
      position: absolute; inset: 0; display: grid; place-items: center;
      background: oklch(0.15 0.01 60 / 0.28);
      opacity: 0; transition: opacity 160ms ease;
    }
    .shot:hover .cue{ opacity: 1; }
    .cue svg{ filter: drop-shadow(0 1px 3px oklch(0 0 0 / 0.5)); }

    .one .shot{ width: 100%; }
  </style>
</helmet>
<div class="{{themeClass}}" style="padding: 16px;">

  <div class="one">
    <sc-for list="{{videos}}" as="v" hint-placeholder-count="1">
      <a class="shot" href="{{v.url}}" target="_blank" rel="noopener" aria-label="{{v.title}}">
            <img src="{{v.thumb}}" alt="">
            <span class="cue">
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.94)"/>
                <path d="M10 8.6l6 3.4-6 3.4V8.6z" fill="#141414"/>
              </svg>
            </span>
            <span class="dur">{{v.duration}}</span>
          </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":620,"height":370}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themeClass: this.props.dark ? 'dark' : '',
      videos: [
        { title: "You DON'T Need To Fast For AUTOPHAGY!", thumb: "no-fast-autophagy.jpg", duration: "0:57", url: "https://www.youtube.com/watch?v=vhyPlX27ztw" }
      ]
    };
  }
}
</script>
</body>
</html>
